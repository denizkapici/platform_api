name: Platform API DevSecOps Pipeline

on:
  push:
    branches: [ "main", "master" ]

jobs:
  security-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # GHCR'ye imaj yüklemek için gerekli izin

    steps:
      - name: Kodları Çek (Checkout)
        uses: actions/checkout@v4

      - name: Şifre ve Token Sızıntı Taraması (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Oracle Cloud Ampere A1 (ARM64) mimarisi için emülatör
      - name: QEMU Kurulumu
        uses: docker/setup-qemu-action@v3

      - name: Docker Buildx Kurulumu
        uses: docker/setup-buildx-action@v3

      - name: Konteyner Güvenlik Taraması (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

      - name: GitHub Container Registry'ye (GHCR) Giriş
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: ARM64 İmajını Derle ve GHCR'ye Yükle
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/arm64
          # Kullanıcı adını otomatik alıp v1.0.0 etiketiyle yükler
          tags: ghcr.io/${{ github.actor }}/platform-api:v1.0.0