apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-api
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: platform-api
  template:
    metadata:
      labels:
        app: platform-api
    spec:
      containers:
      - name: platform-api
        # Şimdilik kendi imajının adı (Docker Hub vs kullanıyorsan onu yaz, örn: kullaniciadi/platform-api:v1.0.0)
        image: ghcr.io/denizkapici/platform-api:v1.0.0
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: 100m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 128Mi
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 3
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: platform-api-service
  namespace: default
spec:
  selector:
    app: platform-api
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
  type: ClusterIP